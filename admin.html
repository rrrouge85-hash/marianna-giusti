<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Marianna Giusti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --black: #1a1a1a; --gray: #888; --border: #e5e5e3; --bg: #f9f9f8; --white: #fff; --red: #991b1b; --red-bg: #fee2e2; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--black); font-size: 14px; -webkit-font-smoothing: antialiased; }
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-box { background: var(--white); border: 0.5px solid var(--border); border-radius: 8px; padding: 2.5rem; width: 340px; }
  .login-title { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 400; margin-bottom: .5rem; }
  .login-sub { font-size: 12px; color: var(--gray); margin-bottom: 2rem; }
  .login-error { font-size: 12px; color: var(--red); margin-bottom: 1rem; display: none; }
  .admin-wrap { display: none; }
  .admin-nav { background: var(--white); border-bottom: 0.5px solid var(--border); padding: 0 2rem; height: 52px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
  .admin-nav-name { font-family: 'Playfair Display', serif; font-size: 14px; }
  .admin-nav-right { display: flex; align-items: center; gap: 1rem; }
  .admin-tabs { display: flex; background: var(--white); border-bottom: 0.5px solid var(--border); padding: 0 2rem; }
  .admin-tab { font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--gray); padding: 1rem 0; margin-right: 2rem; border-bottom: 2px solid transparent; cursor: pointer; background: none; border-top: none; border-left: none; border-right: none; }
  .admin-tab.active { color: var(--black); border-bottom-color: var(--black); }
  .admin-content { max-width: 860px; margin: 0 auto; padding: 2rem; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .card { background: var(--white); border: 0.5px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
  .card-label { font-size: 10px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--gray); margin-bottom: 1rem; }
  label { font-size: 12px; color: var(--gray); display: block; margin-bottom: 4px; margin-top: 12px; }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=url], input[type=password], textarea, select { width: 100%; padding: 9px 12px; font-family: inherit; font-size: 13px; border: 0.5px solid var(--border); border-radius: 6px; background: var(--white); color: var(--black); outline: none; }
  input:focus, textarea:focus, select:focus { border-color: #aaa; }
  textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 120px; gap: 12px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; font-family: inherit; font-size: 12px; font-weight: 500; padding: 8px 16px; border-radius: 6px; cursor: pointer; border: 0.5px solid var(--border); transition: all 0.15s; }
  .btn-primary { background: var(--black); color: var(--white); border-color: var(--black); }
  .btn-primary:hover { opacity: .85; }
  .btn-ghost { background: var(--white); color: var(--black); }
  .btn-ghost:hover { background: var(--bg); }
  .btn-danger { background: var(--white); color: var(--red); border-color: #fca5a5; }
  .btn-danger:hover { background: var(--red-bg); }
  .btn-sm { padding: 5px 10px; font-size: 11px; }
  .admin-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 0.5px solid var(--border); }
  .admin-item:first-child { border-top: 0.5px solid var(--border); }
  .admin-item-info { flex: 1; }
  .admin-item-title { font-size: 13px; line-height: 1.4; margin-bottom: 3px; }
  .admin-item-meta { display: flex; align-items: center; gap: 8px; }
  .tag-pill { font-size: 9px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 2px; }
  .tag-scoop { background: #dbeafe; color: #1e40af; }
  .tag-front { background: #dcfce7; color: #166534; }
  .tag-magazine { background: #fef3c7; color: #92400e; }
  .tag-exclusive { background: #fce7f3; color: #9d174d; }
  .year-text { font-size: 11px; color: var(--gray); }
  .pin-badge { font-size: 9px; background: var(--black); color: #fff; padding: 2px 6px; border-radius: 2px; }
  .item-actions { display: flex; gap: 6px; }
  .edit-form { background: var(--bg); border: 0.5px solid var(--border); border-radius: 6px; padding: 1rem; margin-top: 10px; }
  .edit-form label { margin-top: 8px; }
  .edit-form label:first-child { margin-top: 0; }
  .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--black); color: var(--white); font-size: 12px; padding: 10px 16px; border-radius: 6px; opacity: 0; transform: translateY(8px); transition: all 0.2s; pointer-events: none; z-index: 999; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .section-title { font-size: 10px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--gray); margin: 2rem 0 1rem; }
  .add-form { background: var(--bg); border: 0.5px solid var(--border); border-radius: 8px; padding: 1.25rem; margin-bottom: 1.5rem; }
  .add-form-title { font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--gray); margin-bottom: 1rem; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 1rem; }
  .spinner { color: var(--gray); font-size: 12px; font-style: italic; }
</style>
</head>
<body>

<div class="login-wrap" id="login-screen">
  <div class="login-box">
    <h1 class="login-title">Admin</h1>
    <p class="login-sub">mariannagiusti.com</p>
    <p class="login-error" id="login-error">Email o password errati.</p>
    <label>Email</label>
    <input type="text" id="email" placeholder="email@esempio.com" onkeydown="if(event.key==='Enter')doLogin()">
    <label>Password</label>
    <input type="password" id="pw" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <div style="margin-top:1rem;">
      <button class="btn btn-primary" style="width:100%;justify-content:center;" id="login-btn" onclick="doLogin()">Accedi</button>
    </div>
  </div>
</div>

<div class="admin-wrap" id="admin-screen">
  <div class="admin-nav">
    <span class="admin-nav-name">Marianna Giusti — Admin</span>
    <div class="admin-nav-right">
      <a href="index.html" target="_blank" class="btn btn-ghost btn-sm">Vedi sito →</a>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">Esci</button>
    </div>
  </div>
  <div class="admin-tabs">
    <button class="admin-tab active" onclick="showTab('articoli',this)">Articoli</button>
    <button class="admin-tab" onclick="showTab('video',this)">Video</button>
    <button class="admin-tab" onclick="showTab('longform',this)">Longform</button>
    <button class="admin-tab" onclick="showTab('bio',this)">Bio</button>
  </div>

  <div class="admin-content">

    <div id="tab-articoli" class="tab-panel active">
      <div class="add-form">
        <p class="add-form-title">Aggiungi articolo</p>
        <div class="row-3">
          <div><label>Tag</label>
            <select id="new-tag">
              <option value="scoop">Scoop</option>
              <option value="front">Front page</option>
              <option value="magazine">Magazine</option>
              <option value="exclusive">Exclusive</option>
            </select>
          </div>
          <div><label>Anno</label><input type="text" id="new-year" placeholder="2024"></div>
          <div style="display:flex;align-items:flex-end;padding-bottom:2px;">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin:0;">
              <input type="checkbox" id="new-pinned"> Pinned
            </label>
          </div>
        </div>
        <label>Titolo</label>
        <input type="text" id="new-title" placeholder="Titolo dell'articolo">
        <label>Link FT</label>
        <input type="url" id="new-url" placeholder="https://www.ft.com/...">
        <label>Contesto</label>
        <textarea id="new-context" rows="2" placeholder="Due righe su perché conta questo pezzo..."></textarea>
        <div class="form-actions">
          <button class="btn btn-primary" onclick="addArticle()">Aggiungi</button>
        </div>
      </div>
      <p class="section-title">Articoli pubblicati</p>
      <div id="admin-article-list"><p class="spinner">Caricamento...</p></div>
    </div>

    <div id="tab-video" class="tab-panel">
      <div class="add-form">
        <p class="add-form-title">Aggiungi video</p>
        <label>Titolo</label><input type="text" id="new-vid-title" placeholder="Titolo del video">
        <label>URL</label><input type="url" id="new-vid-url" placeholder="https://...">
        <div class="form-actions"><button class="btn btn-primary" onclick="addVideo()">Aggiungi</button></div>
      </div>
      <p class="section-title">Video pubblicati</p>
      <div id="admin-video-list"><p class="spinner">Caricamento...</p></div>
    </div>

    <div id="tab-longform" class="tab-panel">
      <div class="add-form">
        <p class="add-form-title">Aggiungi longform</p>
        <label>Titolo</label><input type="text" id="new-lf-title" placeholder="Titolo del pezzo">
        <label>Pubblicazione</label><input type="text" id="new-lf-sub" placeholder="FT Weekend Magazine">
        <label>URL PDF</label><input type="url" id="new-lf-url" placeholder="https://...">
        <div class="form-actions"><button class="btn btn-primary" onclick="addLongform()">Aggiungi</button></div>
      </div>
      <p class="section-title">Longform pubblicati</p>
      <div id="admin-longform-list"><p class="spinner">Caricamento...</p></div>
    </div>

    <div id="tab-bio" class="tab-panel">
      <div class="card">
        <p class="card-label">Testo homepage</p>
        <textarea id="admin-bio" rows="5" placeholder="Staff journalist at..."></textarea>
        <div class="form-actions" style="margin-top:1rem;">
          <button class="btn btn-primary" onclick="saveBio()">Salva</button>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL = 'https://uapkjifuwudofxxnntdm.supabase.co';
const SB_KEY = 'sb_publishable_aGRROJn72rZJWamher3uIg_qdWwhq8a';

let authToken = null;
const TAG_LABELS = { scoop:'Scoop', front:'Front page', magazine:'Magazine', exclusive:'Exclusive' };

const H = (extra={}) => ({
  'apikey': SB_KEY,
  'Authorization': 'Bearer ' + (authToken || SB_KEY),
  'Content-Type': 'application/json',
  ...extra
});

async function sbGet(t,p='') { const r=await fetch(`${SB_URL}/rest/v1/${t}?${p}`,{headers:H()}); return r.json(); }
async function sbPost(t,b) { const r=await fetch(`${SB_URL}/rest/v1/${t}`,{method:'POST',headers:H({'Prefer':'return=representation'}),body:JSON.stringify(b)}); return r.json(); }
async function sbPatch(t,id,b) { const r=await fetch(`${SB_URL}/rest/v1/${t}?id=eq.${id}`,{method:'PATCH',headers:H({'Prefer':'return=representation'}),body:JSON.stringify(b)}); return r.json(); }
async function sbDelete(t,id) { await fetch(`${SB_URL}/rest/v1/${t}?id=eq.${id}`,{method:'DELETE',headers:H()}); }

function toast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const pw = document.getElementById('pw').value;
  const btn = document.getElementById('login-btn');
  btn.textContent = '...'; btn.disabled = true;

  const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, {
    method: 'POST',
    headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password: pw })
  });
  const data = await r.json();

  btn.textContent = 'Accedi'; btn.disabled = false;

  if (data.access_token) {
    authToken = data.access_token;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    loadAll();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}

async function doLogout() {
  await fetch(`${SB_URL}/auth/v1/logout`, {
    method: 'POST',
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + authToken }
  });
  authToken = null;
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('pw').value = '';
  document.getElementById('email').value = '';
}

function showTab(id,el) {
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.admin-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active'); el.classList.add('active');
}

async function addArticle() {
  const title=document.getElementById('new-title').value.trim(); if(!title)return;
  await sbPost('articles',{title,tag:document.getElementById('new-tag').value,year:document.getElementById('new-year').value||''+new Date().getFullYear(),context:document.getElementById('new-context').value,url:document.getElementById('new-url').value||'#',pinned:document.getElementById('new-pinned').checked,sort_order:999});
  ['new-title','new-context','new-url','new-year'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('new-pinned').checked=false;
  await loadArticles(); toast('Articolo aggiunto ✓');
}

async function togglePin(id,current) { await sbPatch('articles',id,{pinned:!current}); await loadArticles(); toast(!current?'Pinnato ✓':'Pin rimosso'); }

function toggleEdit(elId) { const el=document.getElementById(elId); el.style.display=el.style.display==='none'?'block':'none'; }

async function saveArticle(id) {
  await sbPatch('articles',id,{
    tag: document.getElementById('et-'+id).value,
    year: document.getElementById('ey-'+id).value,
    pinned: document.getElementById('ep-'+id).checked,
    title: document.getElementById('eti-'+id).value,
    url: document.getElementById('eu-'+id).value,
    context: document.getElementById('ec-'+id).value
  });
  await loadArticles(); toast('Salvato ✓');
}

async function deleteArticle(id) { if(!confirm('Eliminare?'))return; await sbDelete('articles',id); await loadArticles(); toast('Eliminato'); }

async function addVideo() {
  const title=document.getElementById('new-vid-title').value.trim(); if(!title)return;
  await sbPost('videos',{title,url:document.getElementById('new-vid-url').value||'#',sort_order:999});
  ['new-vid-title','new-vid-url'].forEach(id=>document.getElementById(id).value='');
  await loadVideos(); toast('Video aggiunto ✓');
}

async function deleteVideo(id) { if(!confirm('Eliminare?'))return; await sbDelete('videos',id); await loadVideos(); toast('Eliminato'); }

async function toggleVidPin(id,current) { await sbPatch('videos',id,{pinned:!current}); await loadVideos(); toast(!current?'Pinnato ✓':'Pin rimosso'); }

async function saveVideo(id) {
  await sbPatch('videos',id,{ title:document.getElementById('vt-'+id).value, url:document.getElementById('vu-'+id).value });
  await loadVideos(); toast('Salvato ✓');
}

async function addLongform() {
  const title=document.getElementById('new-lf-title').value.trim(); if(!title)return;
  await sbPost('longform',{title,sub:document.getElementById('new-lf-sub').value,url:document.getElementById('new-lf-url').value||'#',sort_order:999});
  ['new-lf-title','new-lf-sub','new-lf-url'].forEach(id=>document.getElementById(id).value='');
  await loadLongform(); toast('Longform aggiunto ✓');
}

async function deleteLongform(id) { if(!confirm('Eliminare?'))return; await sbDelete('longform',id); await loadLongform(); toast('Eliminato'); }

async function toggleLfPin(id,current) { await sbPatch('longform',id,{pinned:!current}); await loadLongform(); toast(!current?'Pinnato ✓':'Pin rimosso'); }

async function saveLongform(id) {
  await sbPatch('longform',id,{ title:document.getElementById('lft-'+id).value, sub:document.getElementById('lfs-'+id).value, url:document.getElementById('lfu-'+id).value });
  await loadLongform(); toast('Salvato ✓');
}

async function loadArticles() {
  const a=await sbGet('articles','order=sort_order.asc,year.desc');
  document.getElementById('admin-article-list').innerHTML=Array.isArray(a)&&a.length?a.map(x=>`
    <div class="admin-item">
      <div class="admin-item-info">
        <p class="admin-item-title">${x.title}</p>
        <div class="admin-item-meta">
          <span class="tag-pill tag-${x.tag}">${TAG_LABELS[x.tag]||x.tag}</span>
          <span class="year-text">${x.year}</span>
          ${x.pinned?'<span class="pin-badge">★ pinned</span>':''}
        </div>
      </div>
      <div class="item-actions">
        <button class="btn btn-ghost btn-sm" onclick="toggleEdit('edit-${x.id}')">Modifica</button>
        <button class="btn btn-ghost btn-sm" onclick="togglePin(${x.id},${x.pinned})">${x.pinned?'Unpin':'Pin'}</button>
        <button class="btn btn-danger btn-sm" onclick="deleteArticle(${x.id})">Elimina</button>
      </div>
      <div id="edit-${x.id}" class="edit-form" style="display:none;">
        <div class="row-3">
          <div><label>Tag</label>
            <select id="et-${x.id}">
              <option value="scoop" ${x.tag==='scoop'?'selected':''}>Scoop</option>
              <option value="front" ${x.tag==='front'?'selected':''}>Front page</option>
              <option value="magazine" ${x.tag==='magazine'?'selected':''}>Magazine</option>
              <option value="exclusive" ${x.tag==='exclusive'?'selected':''}>Exclusive</option>
            </select>
          </div>
          <div><label>Anno</label><input type="text" id="ey-${x.id}" value="${x.year||''}"></div>
          <div style="display:flex;align-items:flex-end;padding-bottom:2px;">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin:0;">
              <input type="checkbox" id="ep-${x.id}" ${x.pinned?'checked':''}> Pinned
            </label>
          </div>
        </div>
        <label>Titolo</label>
        <input type="text" id="eti-${x.id}" value="${(x.title||'').replace(/"/g,'&quot;')}">
        <label>Link</label>
        <input type="url" id="eu-${x.id}" value="${x.url||''}">
        <label>Contesto</label>
        <textarea id="ec-${x.id}" rows="2">${x.context||''}</textarea>
        <div class="form-actions" style="margin-top:.75rem;">
          <button class="btn btn-ghost btn-sm" onclick="toggleEdit('edit-${x.id}')">Annulla</button>
          <button class="btn btn-primary btn-sm" onclick="saveArticle(${x.id})">Salva</button>
        </div>
      </div>
    </div>`).join(''):'<p class="spinner">Nessun articolo ancora.</p>';
}

async function loadVideos() {
  const v=await sbGet('videos','order=sort_order.asc');
  document.getElementById('admin-video-list').innerHTML=Array.isArray(v)&&v.length?v.map(x=>`
    <div class="admin-item">
      <div class="admin-item-info">
        <p class="admin-item-title">${x.title}</p>
        <p style="font-size:11px;color:var(--gray);margin-top:2px;">${x.url}</p>
      </div>
      <div class="item-actions">
        <button class="btn btn-ghost btn-sm" onclick="toggleEdit('vedit-${x.id}')">Modifica</button>
        <button class="btn btn-ghost btn-sm" onclick="toggleVidPin(${x.id},${x.pinned})">${x.pinned?'Unpin':'Pin'}</button>
        <button class="btn btn-danger btn-sm" onclick="deleteVideo(${x.id})">Elimina</button>
      </div>
      <div id="vedit-${x.id}" class="edit-form" style="display:none;">
        <label>Titolo</label>
        <input type="text" id="vt-${x.id}" value="${(x.title||'').replace(/"/g,'&quot;')}">
        <label>URL</label>
        <input type="url" id="vu-${x.id}" value="${x.url||''}">
        <div class="form-actions" style="margin-top:.75rem;">
          <button class="btn btn-ghost btn-sm" onclick="toggleEdit('vedit-${x.id}')">Annulla</button>
          <button class="btn btn-primary btn-sm" onclick="saveVideo(${x.id})">Salva</button>
        </div>
      </div>
    </div>`).join(''):'<p class="spinner">Nessun video ancora.</p>';
}

async function loadLongform() {
  const l=await sbGet('longform','order=sort_order.asc');
  document.getElementById('admin-longform-list').innerHTML=Array.isArray(l)&&l.length?l.map(x=>`
    <div class="admin-item">
      <div class="admin-item-info">
        <p class="admin-item-title">${x.title}</p>
        <p style="font-size:11px;color:var(--gray);margin-top:2px;">${x.sub||''}</p>
      </div>
      <div class="item-actions">
        <button class="btn btn-ghost btn-sm" onclick="toggleEdit('lfedit-${x.id}')">Modifica</button>
        <button class="btn btn-ghost btn-sm" onclick="toggleLfPin(${x.id},${x.pinned})">${x.pinned?'Unpin':'Pin'}</button>
        <button class="btn btn-danger btn-sm" onclick="deleteLongform(${x.id})">Elimina</button>
      </div>
      <div id="lfedit-${x.id}" class="edit-form" style="display:none;">
        <label>Titolo</label>
        <input type="text" id="lft-${x.id}" value="${(x.title||'').replace(/"/g,'&quot;')}">
        <label>Pubblicazione</label>
        <input type="text" id="lfs-${x.id}" value="${(x.sub||'').replace(/"/g,'&quot;')}">
        <label>URL PDF</label>
        <input type="url" id="lfu-${x.id}" value="${x.url||''}">
        <div class="form-actions" style="margin-top:.75rem;">
          <button class="btn btn-ghost btn-sm" onclick="toggleEdit('lfedit-${x.id}')">Annulla</button>
          <button class="btn btn-primary btn-sm" onclick="saveLongform(${x.id})">Salva</button>
        </div>
      </div>
    </div>`).join(''):'<p class="spinner">Nessun longform ancora.</p>';
}

async function loadAll() { await Promise.all([loadArticles(),loadVideos(),loadLongform(),loadBio()]); }

async function loadBio() {
  const s = await sbGet('settings','key=eq.bio&limit=1');
  if (Array.isArray(s) && s[0]) {
    document.getElementById('admin-bio').value = s[0].value || '';
  }
}

async function saveBio() {
  const value = document.getElementById('admin-bio').value;
  const s = await sbGet('settings','key=eq.bio&limit=1');
  if (Array.isArray(s) && s[0]) {
    await fetch(`${SB_URL}/rest/v1/settings?key=eq.bio`, {
      method: 'PATCH',
      headers: H({'Prefer':'return=representation'}),
      body: JSON.stringify({ value })
    });
  } else {
    await sbPost('settings', { key: 'bio', value });
  }
  toast('Bio salvata ✓');
}
</script>
